<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <link rel="stylesheet" type="text/css" href="CSS/main.css">
</head>
<body>
    <!--Countdown-->
    <p>How many seconds would you like to set your alarm for?</p>
    <input id ="seconds" value="" />
    <button onclick="countdown()">Click here</button>
    <p id="timer"></p>

    <!--slide show-->
    <h2>Slide Show</h2>
    <div class="slideshow-container">
        <!--Images-->       
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="images/image1.jpg" alt="tower1">
            <div class="text">Eiffel Tower</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="images/image2.jpg" alt="tower2">
            <div class="text">Leaning Tower of Pisa</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="images/image3.jpg" alt="tower3">
            <div class="text">Empire State Building</div>
        </div>

         <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>


    </div>
    <br>

    <!--The dots/circles-->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
    </div>

    <script src="JS/main.js"></script>
</body>
</html>
